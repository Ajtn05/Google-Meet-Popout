<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meeting popped out</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #16181c;
        --muted: #5c6370;
        --bg: #ffffff;
        --accent: #1a73e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --bg: #1c1e21;
          --accent: #8ab4f8;
        }
      }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.6 system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .card { max-width: 380px; }
      svg { width: 56px; height: 56px; margin-bottom: 18px; }
      h1 { font-size: 17px; font-weight: 600; margin: 0 0 10px; }
      p { color: var(--muted); margin: 0 0 8px; font-size: 13.5px; }
    </style>
  </head>
  <body>
    <div class="card">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <rect x="6" y="16" width="84" height="64" rx="9" fill="var(--accent)"/>
        <rect x="14" y="24" width="68" height="48" rx="5" fill="#0b325f"/>
        <rect x="50" y="50" width="40" height="30" rx="6" fill="#e8f0fe" stroke="var(--accent)" stroke-width="4"/>
      </svg>
      <h1>Your meeting is floating on top</h1>
      <p>
        Firefox only pops a video out when its tab is in the background, so this
        placeholder is holding the meeting tab back while you work elsewhere.
      </p>
      <p>
        Switch back to the browser and this tab closes itself, returning you to
        the meeting.
      </p>
    </div>
  </body>
</html>
